# Hooks, `rebase -x` and `bisect run` export GIT_DIR/GIT_INDEX_FILE (absolute in a worktree), and the
# tests' temp-repo git would follow them into this repo. The runner clears them; see
# tests/git_env_isolation_test.rs. If your own cargo config also sets a `cfg(...)` runner, cargo refuses
# to pick one: override with CARGO_TARGET_<TRIPLE>_RUNNER, and the tests' tripwire still guards git.
[target.'cfg(unix)']
runner = "dev/without-git-repo-env"
